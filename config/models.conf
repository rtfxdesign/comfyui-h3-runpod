#   int8_convrot 34.04 GB each, bf16 66.28 GB each.
# diffusion_models | https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/diffusion_models/minimax_h3_ref2va_int8_convrot.safetensors
# diffusion_models | https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/diffusion_models/minimax_h3_ref2va_bf16.safetensors
# diffusion_models | https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/diffusion_models/minimax_h3_fl2va_bf16.safetensors

# pDMD 2-step image model with the LoRA pre-merged (bf16, 40.24 GB). Same as
