# ============================================================================
#  EXTRA MODELS — downloaded on EVERY tier, after config/tiers/<tier>.conf
#
#  The core H3 stack (image + video models, text encoders, VAEs, turbo LoRAs,
#  pDMD, ControlNet, Eros Max) now comes from the GPU tier manifest:
#      config/tiers/16.conf 24.conf 48.conf 80.conf 96.conf
#  picked by the pod env var H3_TIER (default auto = by VRAM). Those files are
#  generated from tools/tiers_spec.py by tools/build_tiers.py.
#
#  This file is for anything EXTRA you want on every pod. With H3_TIER=none it
#  is the ONLY manifest (plus H3_MODEL_PROFILES), i.e. the old behaviour.
#
#  Format:  <category> | <url> | [filename]
#    category  models/ subfolder (diffusion_models, text_encoders, vae, loras)
#    url       Direct URL; tokens attach automatically by host
#              -- or --  civitai-version:<versionId>  (resolved at boot through
#              the CivitAI API via jq; on any failure the line is skipped with
#              a WARN, never guessed)
#    filename  Raw CivitAI download URLs: REQUIRED (the saved name).
#              civitai-version: lines: optional — if given, that EXACT file of
#              the version is downloaded (e.g. its int8 or bf16 build);
#              if omitted, the version's primary file.
#
#  More models, opt-in, without editing this file:
#    H3_MODEL_PROFILES=fasth3,pika-flex     -> config/profiles/<name>.conf
#    H3_ADULT_LORAS=default|all|none|<keys/ids>  -> config/adult_loras.conf
#    H3_IMAGE_LORAS=default|all|none|<keys/ids>  -> config/image_loras.conf
#
#  >>> API KEYS DO NOT GO HERE <<<  Use RunPod pod Environment Variables:
#  HF_TOKEN  and  CIVITAI_API_TOKEN (CIVITAI_TOKEN also works).
# ============================================================================


# ============================================================================
#  >>>  YOUR LORAS / MODELS  —  ADD THEM HERE  <<<
#
#  HuggingFace:
#    loras | https://huggingface.co/<user>/<repo>/resolve/main/<file>.safetensors
#
#  CivitAI — needs CIVITAI_API_TOKEN; the filename column is REQUIRED:
#    loras | https://civitai.com/api/download/models/<versionId> | my_lora.safetensors
#
#  CivitAI, filename resolved automatically from the version's primary file:
#    loras | civitai-version:<versionId>
# ============================================================================




# ============================================================================
#  OPTIONAL — all names and sizes read from the Hugging Face tree API on
#  2026-11-15. Uncomment to add them on top of your tier.
# ============================================================================

