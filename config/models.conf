# ============================================================================
#  MODEL MANIFEST — MiniMax H3, long-form chained video with character refs
#  TARGET: RunPod, 48 GB VRAM (A6000 / L40S / A40 class)
#
#  Format:  <category> | <url> | [filename]
#    category  models/ subfolder (diffusion_models, text_encoders, vae, loras)
#    url       Direct URL; tokens attach automatically by host
#    filename  Optional rename. REQUIRED for CivitAI URLs.
#
#  >>> API KEYS DO NOT GO HERE <<<  Use .env locally, or RunPod pod
#  Environment Variables:  HF_TOKEN  and  CIVITAI_API_TOKEN
#
#  TOTAL BELOW: ~41.4 GB. Use a 150 GB volume — the multishot master writer
#  spills full-resolution frames per shot, and that adds up fast on long takes.
# ============================================================================


# ----------------------------------------------------------------------------
#  DIFFUSION MODEL — ref2va, pruned, int8_convrot.  19.53 GB
#
#  *** ref2va IS REQUIRED FOR H3AutoRefs. THIS IS NOT INTERCHANGEABLE. ***
#
#  ref2va carries "reference rows" — the identity bank and the nine reference
#  slots that H3AutoRefs feeds. fl2va has NO reference rows, so H3AutoRefs and
#  the identity bank silently do NOTHING on it. If you swap this line for an
#  fl2va checkpoint your character consistency disappears without an error.
#
#  Why pruned (19.53 GB) and not unpruned int8 (31.70 GB) on a 48 GB card:
#  reference tokens ride through EVERY sampling step, and long multishot takes
#  hold large video+audio latents plus per-shot memory frames. The pruned build
#  leaves ~23 GB of working headroom during sampling instead of ~11 GB. On long
#  chains that headroom is what stops an OOM ten shots in. Swap to unpruned
#  only for short 1-2 shot clips where quality matters more than length.
# ----------------------------------------------------------------------------
diffusion_models | https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/diffusion_models/minimax_h3_ref2va_pruned_int8_convrot.safetensors


# ----------------------------------------------------------------------------
#  TEXT ENCODER — Qwen3-VL 32B, nvfp4 AWQ.  14.61 GB
#
#  Smallest of the three (int8 25.3 GB, bf16 48 GB). ComfyUI loads it to encode
#  then evicts it before sampling, so it does not compete with the UNet for
#  resident VRAM — which is why 48 GB is comfortable here rather than tight.
#
#  Load with:  CLIPLoader,  type = minimax
# ----------------------------------------------------------------------------
text_encoders | https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors


# ----------------------------------------------------------------------------
#  VAEs — 5.41 GB.  BOTH REQUIRED, NOT OPTIONAL.
#
#  H3MultishotMemorySampler has separate required video_vae AND audio_vae
#  inputs. It will not run with one of them missing.
# ----------------------------------------------------------------------------
vae | https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/vae/minimax_h3_video_vae_fp16.safetensors
vae | https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/vae/minimax_h3_audio_vae_fp32.safetensors


# ----------------------------------------------------------------------------
#  TURBO LORA — ref2v 4-step.  1.82 GB
#
#  *** MATCHED TO ref2va. Do NOT substitute the fl2v turbo LoRA — different
#  variant, and pairing it with ref2va degrades output. ***
#
#  Wire through H3LoraStack. On a long chain, 4 steps vs 20+ multiplies across
#  every shot, so this is the difference between a take that renders in minutes
#  and one that renders in an hour.
# ----------------------------------------------------------------------------
loras | https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/loras/minimax_h3_ref2v_turbo_4step_v0.1_comfyui_bf16.safetensors


# ============================================================================
#  >>>  YOUR LORAS  —  ADD THEM HERE  <<<
#  Stack them in the workflow via H3LoraStack.
#
#  HuggingFace:
#    loras | https://huggingface.co/<user>/<repo>/resolve/main/<file>.safetensors
#
#  CivitAI — needs CIVITAI_API_TOKEN; the filename column is REQUIRED:
#    loras | https://civitai.com/api/download/models/<versionId> | my_lora.safetensors
# ============================================================================




