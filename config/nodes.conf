# ============================================================================
#  CUSTOM NODE MANIFEST
#
#  Format:  <git-url> | [ref]
#
#  <ref> is an optional branch, tag, or commit SHA.
#
#  PINNING: refs are left unpinned below because these are all actively
#  maintained packs and pinning to a stale commit causes more breakage than it
#  prevents. Once you have a pod you are happy with, freeze it — SSH in and run
#  `git -C /workspace/ComfyUI/custom_nodes/<pack> rev-parse HEAD` for each, then
#  paste the SHAs here. Unpinned custom nodes are the single most common reason
#  a pod that worked last month does not today.
#
#  requirements.txt inside each pack is installed automatically.
#
#  This exact set was verified locally against ComfyUI 0.33.1 — it is what
#  makes the H3 chaining workflows load with zero missing nodes.
#
#  UPDATE 2026-11: the image now pins ComfyUI v0.44.0 (Dockerfile COMFYUI_REF)
#  so the official Comfy-Org H3 templates in workflows/official/ load (their
#  newest needs 0.44.0). ComfyUI-H3-Multishot is pinned to v2.7.2 below; its
#  README recommends ComfyUI 0.34+. The REST of this set has NOT been
#  re-verified on 0.44.0 — check the pod log for import errors on first boot.
#  An existing clone on the volume is not moved to a new pin unless you set
#  NODES_SYNC_PINS=1 (provision.sh warns when it differs).
#
#  UPDATE 2026-11-15: ComfyUI is now v0.45.0 (same commit as the home PC,
#  989d93d0d). ComfyUI-Manager is no longer cloned here: it is the pip package
#  comfyui_manager==4.2.2 from ComfyUI's own manager_requirements.txt, installed
#  in the Dockerfile and switched on with --enable-manager (start.sh).
#  Every URL below answered `git ls-remote` on 2026-11-15. The user's five
#  image workflows (H3_image_*, H3_character_sheet) and the official image /
#  video templates use ONLY core ComfyUI v0.45.0 nodes (checked node-by-node
#  against the v0.45.0 source); the packs here serve the Multishot workflows,
#  LoRA stacking, video export and community workflows.
# ============================================================================


# ----------------------------------------------------------------------------
#  H3 CHAINING — the reason this stack exists.
#
#  Provides the multishot samplers that pass state between segments so a long
#  clip renders as one continuous take instead of visibly stitched cuts.
#  Ships the H3_Extend_Take / H3_Seamless_Chain / H3_Keyframes workflows.
#
#  Pinned to tag v2.7.2 (commit d7d197709fc9). Per its changelog 2.7.2 is a
#  lint-only re-release of 2.7.1 so ComfyUI-Manager can serve it.
#  The pack also carries the JoyEcho prompt-writer pack under writer_pack/ —
#  set H3_INSTALL_WRITER_PACK=1 to have provision.sh copy it into place.
# ----------------------------------------------------------------------------
https://github.com/jlucasmcrell/ComfyUI-H3-Multishot | v2.7.2


# ----------------------------------------------------------------------------
#  MEMORY EFFICIENCY — required by the chaining workflows.
#
#  Provides MiniMaxH3ChunkFeedForward and
#  MiniMaxH3MemoryEfficientSolAttentionPatch. Without this pack the seamless
#  chain workflows will not load at all, and chaining will not fit on a 16 GB
#  card. Not optional despite the name.
# ----------------------------------------------------------------------------
https://github.com/Saganaki22/ComfyUI-sol-attn


# ----------------------------------------------------------------------------
#  VIDEO I/O — load and combine video, the export path for every H3 workflow.
#  Needs ffmpeg, which the Dockerfile installs.
# ----------------------------------------------------------------------------
https://github.com/Kosinkadink/ComfyUI-VideoHelperSuite


# ----------------------------------------------------------------------------
#  FRAME INTERPOLATION — RIFE. This is the "smoother" half of long video:
#  generate at 24 fps, interpolate up, and motion stops stuttering.
# ----------------------------------------------------------------------------
https://github.com/GACLove/ComfyUI-VFI


# ----------------------------------------------------------------------------
#  H3 SPEEDUPS — SpectrumApplyMiniMaxH3, used by most community H3 workflows.
# ----------------------------------------------------------------------------
https://github.com/xmarre/ComfyUI-Spectrum-MiniMax-H3


# ----------------------------------------------------------------------------
#  QUALITY OF LIFE — referenced by nearly every downloaded H3 workflow.
