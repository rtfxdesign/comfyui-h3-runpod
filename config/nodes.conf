# ============================================================================
#  DELIBERATELY OMITTED
#
#  ComfyUI-SolAttn_triton (kijai) — needs Triton. Fine on Linux/RunPod, but it
#  is a real dependency, not a no-op. Uncomment only if you want SolAttnPatch:
# https://github.com/kijai/ComfyUI-SolAttn_triton
#
#  comfyui_nvidia_rtx_nodes — RTXVideoSuperResolution. NVIDIA-specific and
#  large; add it only if you actually want RTX VSR upscaling:
# https://github.com/nvidia/comfyui_nvidia_rtx_nodes
#
#  ComfyUI-H3-Motion-Context (NikoDemon80) — NOT listed here on purpose. The
#  Multishot workflows default to continuity=context_pin, but Multishot v2.7.2
#  refuses every Motion-Context >= 0.4.0 for that mode, and 0.3.1 only runs on
#  ComfyUI <= 0.33. Use continuity=first_frame on this stack. The pack (pinned
#  v0.7.1) is available as a separate opt-in installer for its own chaining
#  nodes: scripts/install-motion-context.sh, or H3_INSTALL_MOTION_CONTEXT=1.
#
#  RES4LYF — provides the `beta57` scheduler that H3_Extend_Take and
#  H3_Seamless_Chain_v2 ship with. Not installed by default (heavy, and not
#  re-verified on ComfyUI 0.44.0); without it set scheduler to `beta`.
#  Latest tag seen 2026-11-05: v1.2.1. To install, uncomment:
# https://github.com/ClownsharkBatwing/RES4LYF | v1.2.1
#
#  ComfyUI-H3-Continuum — the Continuum long-form workflows need it, but it is
#  not in the ComfyUI registry and I could not verify a canonical git URL.
#  Install it from the Manager UI if you want those two workflows.
# ============================================================================
