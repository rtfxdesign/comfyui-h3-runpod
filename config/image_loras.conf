# ============================================================================
#  MINIMAX H3 *IMAGE* LoRA CATALOG — all hosted on CivitAI
#
#  Same format and rules as adult_loras.conf:
#    <key> | <civitai_version_id> | <display name> | <strength> | <trigger> | <default>
#  Files land in models/loras/H3-Image/ and are listed in
#  models/loras/H3-Image/H3_IMAGE_LORAS_INDEX.txt. Needs CIVITAI_API_TOKEN.
#
#  Selection (pod env var H3_IMAGE_LORAS):
#     unset / "default"  -> rows marked default=yes
#     "all" / "none" / comma list of keys or version ids
#
#  Every row below was checked on 2026-11-15 against
#  https://civitai.com/api/v1/model-versions/<id>: HTTP 200, a primary
#  .safetensors file, and a model page that names MiniMax H3 *Image* (not the
#  video model). Strengths are NOT published in a machine-readable way, so the strength
#  column is only a starting point — read each model page.
#
#  These are trained on the IMAGE model. Load them with LoraLoaderModelOnly (or
#  the "H3 Image LoRA Stack" node) between the image UNETLoader and the sampler.
#  Video LoRAs go through the "H3 Video LoRA for H3 Image" node instead.
#
#  The pDMD 2-step speed LoRA is NOT here — it is on Hugging Face and comes
#  with every GPU tier (config/tiers/*.conf):
#    loras/minimax_h3_pdmd_2nfe_comfyui.safetensors  (strength 1.0, 2 steps, euler/simple)
# ============================================================================

